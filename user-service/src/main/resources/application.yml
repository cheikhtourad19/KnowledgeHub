---
# Docker Profile (runs in Docker Compose containers)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_USER_DB:knowledgehub_user}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

server:
  port: ${USER_SERVICE_PORT:8082}

admin:
  email: ${ADMIN_EMAIL}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    teacher-cv: ${MINIO_BUCKET_TEACHER_CV:knowledgehub-teacher-cv}

ai-search:
  service:
    url: ${AI_SEARCH_SERVICE_URL:http://ai-search-service:8000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    tn.esprim.knowledgehub.user: ${LOG_LEVEL_KNOWLEDGEHUB:DEBUG}
