<!-- admin-layout.component.html -->

<!-- Header -->
<nav class="fixed top-0 z-50 w-full bg-white border-b border-gray-200 shadow-sm">
  <div class="px-3 py-3 lg:px-5 lg:pl-3">
    <div class="flex items-center justify-between">
      <!-- Left side: Menu button + Logo -->
      <div class="flex items-center justify-start rtl:justify-end">
        <!-- Drawer toggle button -->
        <button
          (click)="toggleDrawer()"
          type="button"
          class="inline-flex items-center p-2 text-sm text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 transition-colors"
        >
          <span class="sr-only">Open sidebar</span>
          <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
          </svg>
        </button>

        <!-- Logo and App Name -->
        <a routerLink="/admin/etudiants" class="flex items-center ms-2 md:me-24">
          <img src="assets/images/logo_esprim.jpg" class="h-20 me-3" alt="Logo" />
          <span class="self-center text-xl font-semibold sm:text-2xl whitespace-nowrap text-gray-900">KnowledgeHub</span>
        </a>
      </div>

      <!-- Right side: User info -->
      <div class="flex items-center">
        <div class="flex items-center ms-3">
          <!-- User initials badge -->
          <div class="flex items-center space-x-3">


            <!-- User Info -->
            <div class="flex items-center space-x-3 bg-gray-50 rounded-lg px-3 py-2 border border-gray-200">
              <div class="flex-shrink-0">
                <div class="w-10 h-10 bg-primary-700 rounded-full flex items-center justify-center text-white font-semibold shadow-sm">
                  {{ userInitials }}
                </div>
              </div>
              <div class="hidden md:block">
                <p class="text-sm font-semibold text-gray-900">
                  {{ currentUser?.firstName }} {{ currentUser?.lastName }}
                </p>
                <p class="text-xs text-gray-500 capitalize">{{ currentUser?.role }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Drawer -->
<aside
  [class.translate-x-0]="isDrawerOpen"
  [class.-translate-x-full]="!isDrawerOpen"
  class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform bg-white border-r border-gray-200 shadow-xl"
  aria-label="Sidebar"
>
  <div class="h-full px-3 pb-4 overflow-y-auto bg-white flex flex-col">
    <!-- Admin Badge -->
    <div class="mb-4 px-3 py-2 bg-primary-50 rounded-lg border border-primary-200">
      <p class="text-xs font-semibold text-primary-700 uppercase tracking-wide"></p>
    </div>

    <!-- Menu Items -->
    <ul class="space-y-2 font-medium flex-1">
      <li *ngFor="let item of menuItems">
        <a
        [routerLink]="item.route"
        (click)="closeDrawer()"
        [class.bg-primary-700]="isActive(item.route)"
        [class.text-white]="isActive(item.route)"
        [class.text-gray-900]="!isActive(item.route)"
        [class.hover:bg-gray-100]="!isActive(item.route)"
        class="flex items-center p-2 rounded-lg group transition-all duration-200"
        >
        <svg
          [class.text-white]="isActive(item.route)"
          [class.text-gray-500]="!isActive(item.route)"
          [class.group-hover:text-gray-900]="!isActive(item.route)"
          class="w-5 h-5 transition duration-75"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <span class="ms-3">{{ item.label }}</span>

        <!-- Active indicator -->
        <span
          *ngIf="isActive(item.route)"
          class="ms-auto w-2 h-2 bg-white rounded-full"
        ></span>
        </a>
      </li>
    </ul>

    <!-- Logout Button at Bottom -->
    <div class="pt-4 mt-4 border-t border-gray-200">
      <button
        (click)="logout()"
        class="flex items-center w-full p-2 text-gray-900 rounded-lg hover:bg-red-50 hover:text-red-600 group transition-all duration-200"
      >
        <svg
          class="w-5 h-5 text-gray-500 group-hover:text-red-600 transition duration-75"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="ms-3 font-medium">Déconnexion</span>
      </button>
    </div>
  </div>
</aside>

<!-- Overlay (clicks outside to close drawer) -->
<div
  *ngIf="isDrawerOpen"
  (click)="closeDrawer()"
  class="fixed inset-0 z-30 bg-gray-900/50 backdrop-blur-sm transition-opacity"
></div>

<!-- Main Content -->
<div class="p-4 sm:ml-0 mt-20 min-h-screen bg-gray-50 ">
  <div class="p-4 rounded-lg">
    <router-outlet></router-outlet>
  </div>
</div>
