<div
  class="flex items-center gap-3 mb-6 pb-5 border-b border-gray-200 dark:border-gray-700"
>
  <button
    type="button"
    (click)="goBack()"
    class="inline-flex items-center justify-center w-9 h-9 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:bg-[#C60C30] hover:border-[#C60C30] hover:text-white transition-all duration-200 shadow-sm"
  >
    <svg
      class="w-4 h-4"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 19l-7-7 7-7"
      />
    </svg>
  </button>
  <h2 class="text-lg font-bold text-gray-900 dark:text-white">
    Détails du PFE
  </h2>
</div>

<app-pfe-details-view [pfe]="pfe!" />

<div
  *ngIf="pfe && isAssignedRapporteur()"
  class="mt-6 rounded-lg border border-amber-200 dark:border-amber-800 bg-amber-50/80 dark:bg-amber-900/20 p-5"
>
  <div class="flex items-center gap-2 mb-2">
    <i class="pi pi-comments text-amber-700 dark:text-amber-400"></i>
    <h3
      class="text-sm font-bold text-amber-900 dark:text-amber-300 uppercase tracking-widest"
    >
      Feedback Rapporteur
    </h3>
  </div>

  <p class="text-xs text-amber-800 dark:text-amber-300 mb-3">
    Vous pouvez soumettre un feedback et le modifier à tout moment.
  </p>

  <textarea
    rows="5"
    [(ngModel)]="rapporteurFeedback"
    placeholder="Ajoutez vos commentaires sur le rapport..."
    class="w-full rounded-lg border border-amber-200 dark:border-amber-700 bg-white dark:bg-gray-900 text-sm text-gray-900 dark:text-white p-3"
  ></textarea>

  <div class="mt-3 flex justify-end">
    <p-button
      label="Envoyer feedback"
      icon="pi pi-send"
      [loading]="savingFeedback"
      [disabled]="!rapporteurFeedback.trim() || savingFeedback"
      [style]="{
        'background-color': '#C60C30',
        'border-color': '#C60C30',
        color: '#FFFFFF',
      }"
      (onClick)="submitRapporteurFeedback()"
    ></p-button>
  </div>
</div>
