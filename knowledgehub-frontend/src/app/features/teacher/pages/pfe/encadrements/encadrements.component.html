@if (loading) {
  <div class="flex justify-center items-center py-20">
    <i class="pi pi-spin pi-spinner text-4xl text-[#C60C30]"></i>
  </div>
}

<!-- CV Card -->
<div
  class="rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden mb-6"
>
  <div
    class="flex items-center gap-2.5 px-5 py-3 bg-[#333333] border-l-[4px] border-[#C60C30]"
  >
    <i class="pi pi-file-pdf text-[#C60C30] text-sm"></i>
    <h3 class="text-white text-xs font-bold uppercase tracking-widest">
      Mon CV
    </h3>
  </div>
  <div class="p-5 bg-white dark:bg-gray-900">
    @if (cvLoading) {
      <div class="flex items-center gap-2 text-sm text-gray-500">
        <i class="pi pi-spin pi-spinner"></i>
        <span>Chargement du CV...</span>
      </div>
    } @else if (cv) {
      <div
        class="flex items-center justify-between rounded-lg -mx-1 px-1 transition-colors"
      >
        <div class="flex items-center gap-3 min-w-0">
          <i class="pi pi-file-pdf text-[#C60C30] text-2xl flex-shrink-0"></i>
          <div class="min-w-0">
            <p class="font-semibold text-gray-900 dark:text-white text-sm truncate">
              {{ cv.fileName }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
              {{ cv.fileSize | number }} octets
              @if (cv.uploadedAt) {
                · {{ cv.uploadedAt | date: "dd/MM/yyyy" }}
              }
            </p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <i
            class="pi pi-eye text-[#C60C30] text-base cursor-pointer hover:text-[#a00a26] transition-colors"
            pTooltip="Visualiser"
            (click)="viewCV()"
          ></i>
          <input
            type="file"
            #cvFileInput
            accept="application/pdf"
            (change)="onFileSelected($event)"
            class="hidden"
          />
          <p-button
            label="Remplacer"
            icon="pi pi-refresh"
            severity="secondary"
            [outlined]="true"
            [loading]="uploadLoading"
            (onClick)="cvFileInput.click(); $event.stopPropagation()"
          />
        </div>
      </div>
    } @else {
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
          <i class="pi pi-info-circle"></i>
          <span>Aucun CV uploadé.</span>
        </div>
        <div>
          <input
            type="file"
            #cvFileInput
            accept="application/pdf"
            (change)="onFileSelected($event)"
            class="hidden"
          />
          <p-button
            label="Uploader mon CV"
            icon="pi pi-upload"
            severity="secondary"
            [outlined]="true"
            [loading]="uploadLoading"
            (onClick)="cvFileInput.click()"
          />
        </div>
      </div>
    }
  </div>
</div>

<app-pfe-table
  [allPfes]="allPfes"
  title="Mes encadrements"
  (pfeClick)="viewDetails($event)"
/>

<app-pdf-viewer-modal
  [(visible)]="showPdfModal"
  [pdfUrl]="currentPdfUrl"
  [title]="currentPdfTitle"
></app-pdf-viewer-modal>
