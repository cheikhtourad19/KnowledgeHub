<p-toast />
<app-loading-overlay />

<!-- Hero Section - Only show on home page -->
<div class="home-container" *ngIf="isHomePage">
  <div class="hero-section">
    <div class="hero-content">
      <!-- Logo -->
      <div class="logo-container">
        <img
          src="assets/images/logo_esprim.jpg"
          alt="Logo KnowledgeHub"
          class="hero-logo"
        />
      </div>

      <!-- Title -->
      <h1 class="hero-title">Bienvenue sur KnowledgeHub</h1>
      <p class="hero-subtitle">Votre plateforme de gestion des connaissances</p>

      <!-- Call to Action Buttons -->
      <div class="hero-actions">
        <!-- Show login button if not authenticated -->
        <button
          *ngIf="!authService.isAuthenticated()"
          class="btn-primary"
          (click)="navigateToLogin()"
        >
          <i class="pi pi-sign-in"></i>
          Se connecter
        </button>

        <!-- Show dashboard button if authenticated -->
        <button
          *ngIf="authService.isAuthenticated()"
          class="btn-primary"
          (click)="navigateToMySpace()"
        >
          <i class="pi pi-home"></i>
          Aller vers mon espace
        </button>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
