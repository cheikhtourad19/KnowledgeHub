<p-dialog
  [header]="title"
  [(visible)]="visible"
  (visibleChange)="closeModal()"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '90vw', height: '90vh' }"
  [contentStyle]="{ padding: '0', height: 'calc(90vh - 60px)' }"
  [draggable]="true"
  [resizable]="true"
  [maximizable]="true">

  <div class="w-full h-full bg-gray-100 dark:bg-gray-800">
    <pdf-viewer
      *ngIf="pdfUrl"
      [src]="pdfUrl"
      [render-text]="true"
      [show-all]="true"
      [original-size]="false"
      [fit-to-page]="true"
      [zoom]="1"
      style="display: block; width: 100%; height: 100%">
    </pdf-viewer>
  </div>

  <ng-template pTemplate="footer">
    <button
      (click)="closeModal()"
      class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition-colors">
      <i class="pi pi-times mr-2"></i>

    </button>
  </ng-template>
</p-dialog>
