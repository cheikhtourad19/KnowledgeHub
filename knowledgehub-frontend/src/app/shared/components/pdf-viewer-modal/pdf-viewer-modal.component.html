<p-dialog
  [header]="title"
  [(visible)]="visible"
  (visibleChange)="closeModal()"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '90vw', height: '90vh' }"
  [contentStyle]="{ padding: '0', height: 'calc(90vh - 60px)' }"
  [draggable]="true"
  [resizable]="true"
  [maximizable]="true">

  <div class="w-full h-full bg-gray-100 dark:bg-gray-800 relative">
    @if (pdfLoading) {
      <div class="absolute inset-0 flex items-center justify-center bg-gray-100 dark:bg-gray-800 z-10">
        <div class="flex flex-col items-center gap-3">
          <i class="pi pi-spin pi-spinner text-3xl text-[#C60C30]"></i>
          <span class="text-sm text-gray-500">Chargement du document...</span>
        </div>
      </div>
    }
    <pdf-viewer
      *ngIf="pdfUrl"
      [src]="pdfUrl"
      [render-text]="false"
      [show-all]="true"
      [original-size]="false"
      [fit-to-page]="true"
      (after-load-complete)="onLoadComplete()"
      (on-error)="onError()"
      style="display: block; width: 100%; height: 100%">
    </pdf-viewer>
  </div>

  <ng-template pTemplate="footer">
    <button
      (click)="closeModal()"
      class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition-colors">
      <i class="pi pi-times mr-2"></i>

    </button>
  </ng-template>
</p-dialog>
