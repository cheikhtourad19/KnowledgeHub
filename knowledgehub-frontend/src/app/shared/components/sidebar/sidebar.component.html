<aside
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
  class="fixed top-0 left-0 z-40 w-64 h-screen pt-16 transition-transform duration-300 ease-in-out bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 shadow-xl flex flex-col"
>
  <div class="h-1 bg-[#C60C30] w-full"></div>
  <div class="px-4 py-4 border-b border-gray-100 dark:border-gray-800">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0"
        [ngClass]="avatarColor === 'red' ? 'bg-[#C60C30]' : 'bg-[#333333]'"
      >
        {{ userInitials }}
      </div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-[#333333] dark:text-white truncate">
          {{ currentUser?.firstName }} {{ currentUser?.lastName }}
        </p>
        <p
          class="text-[10px] text-[#666666] dark:text-gray-400 uppercase tracking-widest"
        >
          {{ currentUser?.role || "Utilisateur" }}
        </p>
      </div>
    </div>
  </div>

  <!-- All nav items injected here -->
  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
    <ng-content></ng-content>
  </nav>

  <div class="px-3 py-4 border-t border-gray-100 dark:border-gray-800">
    <button
      (click)="logout.emit()"
      class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-[#666666] dark:text-gray-400 hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-[#C60C30] dark:hover:text-red-400 transition-all duration-200 group"
    >
      <i class="pi pi-sign-out text-base group-hover:text-[#C60C30]"></i>
      <span class="text-sm font-medium">Déconnexion</span>
    </button>
  </div>
</aside>

@if (isOpen) {
  <div
    (click)="close.emit()"
    class="fixed inset-0 z-30 bg-gray-900/40 backdrop-blur-sm transition-opacity"
  ></div>
}
