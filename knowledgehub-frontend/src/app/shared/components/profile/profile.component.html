<div class="space-y-6">
  <!-- Page Header -->
  <div
    class="flex items-center gap-4 pb-5 border-b border-gray-200 dark:border-gray-700"
  >
    <div
      class="w-12 h-12 bg-primary-700 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm flex-shrink-0"
    >
      {{ userInitials }}
    </div>
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
        Mon Profil
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Gérez vos informations personnelles et votre sécurité
      </p>
    </div>
  </div>

  <!-- Password Section -->
  <div
    class="bg-gray-50 dark:bg-gray-800/50 rounded-lg border border-gray-200 dark:border-gray-700"
  >
    <!-- Section Header -->
    <div
      class="flex items-center gap-3 px-5 py-4 border-b border-gray-200 dark:border-gray-700"
    >
      <div
        class="w-8 h-8 bg-primary-100 dark:bg-primary-900/40 rounded-lg flex items-center justify-center flex-shrink-0"
      >
        <svg
          class="w-4 h-4 text-primary-700 dark:text-primary-400"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          />
        </svg>
      </div>
      <div>
        <h2 class="text-base font-semibold text-gray-900 dark:text-white">
          Changer le mot de passe
        </h2>
        <p class="text-xs text-gray-500 dark:text-gray-400">
          Utilisez un mot de passe fort d'au moins 6 caractères
        </p>
      </div>
    </div>

    <!-- Form -->
    <form
      [formGroup]="passwordForm"
      (ngSubmit)="submitPassword()"
      class="p-5 space-y-4"
    >
      <!-- Old Password -->
      <div>
        <label
          for="oldPassword"
          class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
        >
          Mot de passe actuel <span class="text-red-500">*</span>
        </label>
        <input
          id="oldPassword"
          type="password"
          formControlName="oldPassword"
          placeholder="Entrez votre mot de passe actuel"
          class="w-full px-3 py-2.5 text-sm text-gray-900 dark:text-white bg-white dark:bg-gray-700 border rounded-lg placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 transition-colors"
          [class.border-gray-300]="
            !(
              passwordForm.get('oldPassword')?.invalid &&
              passwordForm.get('oldPassword')?.touched
            )
          "
          [class.dark:border-gray-600]="
            !(
              passwordForm.get('oldPassword')?.invalid &&
              passwordForm.get('oldPassword')?.touched
            )
          "
          [class.focus:ring-primary-500]="
            !(
              passwordForm.get('oldPassword')?.invalid &&
              passwordForm.get('oldPassword')?.touched
            )
          "
          [class.focus:border-primary-500]="
            !(
              passwordForm.get('oldPassword')?.invalid &&
              passwordForm.get('oldPassword')?.touched
            )
          "
          [class.border-red-400]="
            passwordForm.get('oldPassword')?.invalid &&
            passwordForm.get('oldPassword')?.touched
          "
          [class.dark:border-red-500]="
            passwordForm.get('oldPassword')?.invalid &&
            passwordForm.get('oldPassword')?.touched
          "
          [class.focus:ring-red-300]="
            passwordForm.get('oldPassword')?.invalid &&
            passwordForm.get('oldPassword')?.touched
          "
          [class.bg-red-50]="
            passwordForm.get('oldPassword')?.invalid &&
            passwordForm.get('oldPassword')?.touched
          "
          [class.dark:bg-red-900/10]="
            passwordForm.get('oldPassword')?.invalid &&
            passwordForm.get('oldPassword')?.touched
          "
        />
        <p
          *ngIf="
            passwordForm.get('oldPassword')?.invalid &&
            passwordForm.get('oldPassword')?.touched
          "
          class="mt-1.5 text-xs text-red-500 flex items-center gap-1"
        >
          <svg
            class="w-3.5 h-3.5 flex-shrink-0"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
          Ce champ est requis
        </p>
      </div>

      <!-- New + Confirm side by side on md+ -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- New Password -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
          >
            Nouveau mot de passe <span class="text-red-500">*</span>
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Minimum 6 caractères"
            class="w-full px-3 py-2.5 text-sm text-gray-900 dark:text-white bg-white dark:bg-gray-700 border rounded-lg placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 transition-colors"
            [class.border-gray-300]="
              !(
                passwordForm.get('password')?.invalid &&
                passwordForm.get('password')?.touched
              )
            "
            [class.dark:border-gray-600]="
              !(
                passwordForm.get('password')?.invalid &&
                passwordForm.get('password')?.touched
              )
            "
            [class.focus:ring-primary-500]="
              !(
                passwordForm.get('password')?.invalid &&
                passwordForm.get('password')?.touched
              )
            "
            [class.focus:border-primary-500]="
              !(
                passwordForm.get('password')?.invalid &&
                passwordForm.get('password')?.touched
              )
            "
            [class.border-red-400]="
              passwordForm.get('password')?.invalid &&
              passwordForm.get('password')?.touched
            "
            [class.dark:border-red-500]="
              passwordForm.get('password')?.invalid &&
              passwordForm.get('password')?.touched
            "
            [class.focus:ring-red-300]="
              passwordForm.get('password')?.invalid &&
              passwordForm.get('password')?.touched
            "
            [class.bg-red-50]="
              passwordForm.get('password')?.invalid &&
              passwordForm.get('password')?.touched
            "
            [class.dark:bg-red-900/10]="
              passwordForm.get('password')?.invalid &&
              passwordForm.get('password')?.touched
            "
          />
          <p
            *ngIf="
              passwordForm.get('password')?.invalid &&
              passwordForm.get('password')?.touched
            "
            class="mt-1.5 text-xs text-red-500 flex items-center gap-1"
          >
            <svg
              class="w-3.5 h-3.5 flex-shrink-0"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd"
              />
            </svg>
            <ng-container
              *ngIf="passwordForm.get('password')?.errors?.['required']"
              >Ce champ est requis</ng-container
            >
            <ng-container
              *ngIf="passwordForm.get('password')?.errors?.['minlength']"
              >Minimum 6 caractères requis</ng-container
            >
          </p>
        </div>

        <!-- Confirm Password -->
        <div>
          <label
            for="confirmPassword"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
          >
            Confirmer le mot de passe <span class="text-red-500">*</span>
          </label>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            placeholder="Répétez le nouveau mot de passe"
            class="w-full px-3 py-2.5 text-sm text-gray-900 dark:text-white bg-white dark:bg-gray-700 border rounded-lg placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 transition-colors"
            [class.border-gray-300]="
              !(
                passwordForm.get('confirmPassword')?.invalid &&
                passwordForm.get('confirmPassword')?.touched
              )
            "
            [class.dark:border-gray-600]="
              !(
                passwordForm.get('confirmPassword')?.invalid &&
                passwordForm.get('confirmPassword')?.touched
              )
            "
            [class.focus:ring-primary-500]="
              !(
                passwordForm.get('confirmPassword')?.invalid &&
                passwordForm.get('confirmPassword')?.touched
              )
            "
            [class.focus:border-primary-500]="
              !(
                passwordForm.get('confirmPassword')?.invalid &&
                passwordForm.get('confirmPassword')?.touched
              )
            "
            [class.border-red-400]="
              passwordForm.get('confirmPassword')?.invalid &&
              passwordForm.get('confirmPassword')?.touched
            "
            [class.dark:border-red-500]="
              passwordForm.get('confirmPassword')?.invalid &&
              passwordForm.get('confirmPassword')?.touched
            "
            [class.focus:ring-red-300]="
              passwordForm.get('confirmPassword')?.invalid &&
              passwordForm.get('confirmPassword')?.touched
            "
            [class.bg-red-50]="
              passwordForm.get('confirmPassword')?.invalid &&
              passwordForm.get('confirmPassword')?.touched
            "
            [class.dark:bg-red-900/10]="
              passwordForm.get('confirmPassword')?.invalid &&
              passwordForm.get('confirmPassword')?.touched
            "
          />
          <p
            *ngIf="
              passwordForm.get('confirmPassword')?.invalid &&
              passwordForm.get('confirmPassword')?.touched
            "
            class="mt-1.5 text-xs text-red-500 flex items-center gap-1"
          >
            <svg
              class="w-3.5 h-3.5 flex-shrink-0"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd"
              />
            </svg>
            Ce champ est requis
          </p>
        </div>
      </div>

      <!-- Hint Bar -->
      <div
        class="flex items-center gap-2 px-3 py-2.5 bg-white dark:bg-gray-700/50 rounded-lg border border-gray-200 dark:border-gray-600"
      >
        <svg
          class="w-4 h-4 flex-shrink-0 transition-colors duration-200"
          [class.text-green-500]="
            (passwordForm.get('password')?.value?.length ?? 0) >= 6
          "
          [class.text-gray-300]="
            (passwordForm.get('password')?.value?.length ?? 0) < 6
          "
          [class.dark:text-gray-600]="
            (passwordForm.get('password')?.value?.length ?? 0) < 6
          "
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd"
          />
        </svg>
        <span
          class="text-xs font-medium transition-colors duration-200"
          [class.text-green-600]="
            (passwordForm.get('password')?.value?.length ?? 0) >= 6
          "
          [class.dark:text-green-400]="
            (passwordForm.get('password')?.value?.length ?? 0) >= 6
          "
          [class.text-gray-400]="
            (passwordForm.get('password')?.value?.length ?? 0) < 6
          "
          [class.dark:text-gray-500]="
            (passwordForm.get('password')?.value?.length ?? 0) < 6
          "
        >
          Au moins 6 caractères
        </span>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="passwordForm.reset()"
          class="px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:focus:ring-gray-600 transition-colors"
        >
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="passwordForm.invalid"
          class="flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-white bg-primary-700 rounded-lg hover:bg-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-300 dark:focus:ring-primary-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          <svg
            class="w-4 h-4"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
          Mettre à jour
        </button>
      </div>
    </form>
  </div>
</div>
