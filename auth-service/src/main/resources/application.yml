server:
  port: 8081
notification:
  service:
    url: http://localhost:8084
spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/knowledgehub_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    defer-datasource-initialization: false

# JWT Configuration
jwt:
  secret: PzwO3GB4uHSLcSFKFrU3aL70Uy0k9HNpqjLrcc4hVXq
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    tn.esprim.knowledgehub.auth: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE