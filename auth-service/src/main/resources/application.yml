---
# Docker Profile (runs in Docker Compose containers)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_AUTH_DB}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

server:
  port: ${AUTH_SERVICE_PORT}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    tn.esprim.knowledgehub.auth: ${LOG_LEVEL_KNOWLEDGEHUB:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
