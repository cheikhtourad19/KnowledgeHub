# Default Profile (Local Development)
server:
  port: 8083

# Service URLs
notification:
  service:
    url: http://localhost:8084

user:
  service:
    url: http://localhost:8082

ai-search:
  service:
    url: http://localhost:8000

spring:
  application:
    name: resource-service

  # Exclude MongoDB auto-configuration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  datasource:
    url: jdbc:mysql://localhost:3306/knowledgehub_ressource?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: JYzNL0Tfb5r65W3dayz03/xDwS34yj6Z

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

# Feign Configuration - SINGLE SOURCE OF TRUTH
feign:
  client:
    config:
      default:
        connectTimeout: 10000 # 10 seconds
        readTimeout: 300000 # 5 minutes for AI processing
      # Specific timeout for AI client (if you want different from default)
      ai-search-service:
        connectTimeout: 10000
        readTimeout: 600000 # 10 minutes for heavy AI operations

# MinIO Configuration
minio:
  endpoint: http://localhost:9000  # Internal endpoint for file operations
  external-endpoint: http://localhost:9000 # External endpoint for presigned URLs (browser access)
  access-key: minioadmin
  secret-key: IM0i7/Sb3/tGGxWQdtxBtMRWov3fZ3qf
  bucket-name: knowledgehub-documents
  buckets:
    documents: knowledgehub-documents
    pfa: knowledgehub-pfa
    pfe: knowledgehub-pfe
    stage: knowledgehub-stage
    journal: knowledgehub-journal
    attestation: knowledgehub-attestation

# CORS Configuration
cors:
  allowed-origins: http://localhost:*,http://127.0.0.1:*,http://localhost:8080

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: WARN
    tn.esprim.knowledgehub.resource: DEBUG
    feign: DEBUG # Added to debug Feign calls

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_RESOURCE_DB}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${RESOURCE_SERVICE_PORT:8083}

# Service URLs for Docker
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL}

user:
  service:
    url: ${USER_SERVICE_URL}

ai-search:
  service:
    url: ${AI_SEARCH_SERVICE_URL}

# MinIO for Docker
minio:
  endpoint: ${MINIO_ENDPOINT}  # Internal Docker endpoint (http://minio:9000)
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}  # External endpoint for browser access
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_DOCUMENTS}
  buckets:
    documents: ${MINIO_BUCKET_DOCUMENTS}
    pfa: ${MINIO_BUCKET_PFA}
    pfe: ${MINIO_BUCKET_PFE}
    stage: ${MINIO_BUCKET_STAGE}
    journal: ${MINIO_BUCKET_JOURNAL}
    attestation: ${MINIO_BUCKET_ATTESTATION}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:8080}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    tn.esprim.knowledgehub.resource: ${LOG_LEVEL_KNOWLEDGEHUB:DEBUG}
    feign: ${LOG_LEVEL_FEIGN:DEBUG}
