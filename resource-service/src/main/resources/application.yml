server:
  port: ${RESOURCE_SERVICE_PORT}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL}

user:
  service:
    url: ${USER_SERVICE_URL}

ai-search:
  service:
    url: ${AI_SEARCH_SERVICE_URL}

spring:
  application:
    name: resource-service

  # Explicitly exclude MongoDB auto-configuration (resource-service uses MySQL only)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_RESOURCE_DB}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_DOCUMENTS}
  buckets:
    documents: ${MINIO_BUCKET_DOCUMENTS}
    pfa: ${MINIO_BUCKET_PFA}
    pfe: ${MINIO_BUCKET_PFE}
    stage: ${MINIO_BUCKET_STAGE}
    journal: ${MINIO_BUCKET_JOURNAL}
    attestation: ${MINIO_BUCKET_ATTESTATION}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    tn.esprim.knowledgehub.resource: ${LOG_LEVEL_KNOWLEDGEHUB:DEBUG}
