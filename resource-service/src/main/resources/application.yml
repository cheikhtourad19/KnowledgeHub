server:
  port: 8083

notification:
  service:
    url: http://localhost:8084

spring:
  application:
    name: resource-service

  datasource:
    url: jdbc:mysql://localhost:3306/knowledgehub_ressource?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

# MinIO Configuration
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: knowledgehub
  buckets:
    documents: knowledgehub-documents
    pfa: knowledgehub-pfa
    pfe: knowledgehub-pfe
    stage: knowledgehub-stage
    journal: knowledgehub-journal
    attestation: knowledgehub-attestation

# CORS Configuration
cors:
  allowed-origins: http://localhost:*,http://127.0.0.1:*,http://localhost:8080,https://*.yourdomain.com

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
