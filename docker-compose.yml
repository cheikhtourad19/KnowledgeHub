services:
  # ========================================
  # Infrastructure Services
  # ========================================

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: knowledgehub-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_AUTH_DB}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
    
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: knowledgehub-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MinIO Object Storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: knowledgehub-minio
    ports:
      - "9000:9000"           # API port
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Console UI port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - knowledgehub-network
    restart: unless-stopped

  # ========================================
  # Microservices
  # ========================================

  # API Gateway
  api-gateway:
    image: ${REGISTRY:-docker.io}/${REGISTRY_USERNAME}/knowledgehub-api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: knowledgehub-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      RESOURCE_SERVICE_URL: ${RESOURCE_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      AI_SEARCH_SERVICE_URL: ${AI_SEARCH_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOGGING_LEVEL_TN_ESPRIM: ${LOG_LEVEL_KNOWLEDGEHUB:-INFO}
      LOG_LEVEL_GATEWAY: ${LOG_LEVEL_GATEWAY:-DEBUG}
      LOG_LEVEL_NETTY: ${LOG_LEVEL_NETTY:-DEBUG}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Auth Service
  auth-service:
    image: ${REGISTRY:-docker.io}/${REGISTRY_USERNAME}/knowledgehub-auth-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: knowledgehub-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-8081}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_AUTH_DB}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOGGING_LEVEL_TN_ESPRIM: ${LOG_LEVEL_KNOWLEDGEHUB:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # User Service
  user-service:
    image: ${REGISTRY:-docker.io}/${REGISTRY_USERNAME}/knowledgehub-user-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: knowledgehub-user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-8082}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER_DB: ${MYSQL_USER_DB}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_USER_DB}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOGGING_LEVEL_TN_ESPRIM: ${LOG_LEVEL_KNOWLEDGEHUB:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Resource Service
  resource-service:
    image: ${REGISTRY:-docker.io}/${REGISTRY_USERNAME}/knowledgehub-resource-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    container_name: knowledgehub-resource-service
    ports:
      - "${RESOURCE_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      RESOURCE_SERVICE_PORT: ${RESOURCE_SERVICE_PORT:-8083}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_RESOURCE_DB: ${MYSQL_RESOURCE_DB}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_RESOURCE_DB}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS}
      MINIO_BUCKET_PFA: ${MINIO_BUCKET_PFA}
      MINIO_BUCKET_PFE: ${MINIO_BUCKET_PFE}
      MINIO_BUCKET_STAGE: ${MINIO_BUCKET_STAGE}
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT}
      MINIO_BUCKET_JOURNAL: ${MINIO_BUCKET_JOURNAL}
      MINIO_BUCKET_ATTESTATION: ${MINIO_BUCKET_ATTESTATION}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      AI_SEARCH_SERVICE_URL: ${AI_SEARCH_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOGGING_LEVEL_TN_ESPRIM: ${LOG_LEVEL_KNOWLEDGEHUB:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Notification Service
  notification-service:
    image: ${REGISTRY:-docker.io}/${REGISTRY_USERNAME}/knowledgehub-notification-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: knowledgehub-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-8084}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      SPRING_DATA_MONGODB_URI: ${MONGO_URI}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOGGING_LEVEL_TN_ESPRIM: ${LOG_LEVEL_KNOWLEDGEHUB:-INFO}
      LOG_LEVEL_MONGODB: ${LOG_LEVEL_MONGODB:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # AI & Search Service
  ai-search-service:
    image: ${REGISTRY:-docker.io}/${REGISTRY_USERNAME}/knowledgehub-ai-search-service:${IMAGE_TAG:-latest}
    build:
      context: ./ai-and-search-service
      dockerfile: Dockerfile
    container_name: knowledgehub-ai-search-service
    env_file:
      - ./ai-and-search-service/.env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
    ports:
      - "${AI_SEARCH_SERVICE_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/app/chroma_db
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Angular Frontend
  frontend:
    image: ${REGISTRY:-docker.io}/${REGISTRY_USERNAME}/knowledgehub-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./knowledgehub-frontend
      dockerfile: Dockerfile
    container_name: knowledgehub-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - knowledgehub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: knowledgehub-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux needs this; Mac/Win have it automatically
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - knowledgehub-network
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: knowledgehub-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - knowledgehub-network
    restart: unless-stopped
# ========================================
# Networks
# ========================================
networks:
  knowledgehub-network:
    driver: bridge
    name: ${DOCKER_NETWORK:-knowledgehub-network}

# ========================================
# Persistent Volumes
# ========================================
volumes:
  mysql_data:
    driver: local
    name: knowledgehub-mysql-data
  mongodb_data:
    driver: local
    name: knowledgehub-mongodb-data
  minio_data:
    driver: local
    name: knowledgehub-minio-data
  chromadb_data:
    driver: local
    name: knowledgehub-chromadb-data
  prometheus_data:
    driver: local
    name: knowledgehub-prometheus-data
  grafana_data:
    driver: local
    name: knowledgehub-grafana-data