server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth-service/**
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/user-service/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: ressource-service
          uri: ${RESOURCE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/ressource-service/**
          filters:
            - RewritePath=/ressource-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/notification-service/**
          filters:
            - RewritePath=/notification-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: ai-search-service
          uri: ${AI_SEARCH_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/ai-service/**
          filters:
            - RewritePath=/ai-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:DEBUG}
    reactor.netty: ${LOG_LEVEL_NETTY:DEBUG}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
