# Default Profile (Local Development) - Hardcoded values matching local infrastructure
server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 100MB
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth-service/**
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/user-service/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: ressource-service
          uri: http://localhost:8083
          predicates:
            - Path=/ressource-service/**
          filters:
            - RewritePath=/ressource-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/notification-service/**
          filters:
            - RewritePath=/notification-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: ai-search-service
          uri: http://localhost:8000
          predicates:
            - Path=/ai-service/**
          filters:
            - RewritePath=/ai-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

jwt:
  secret: SMHWV9Em+mtG0bVR9Cpoummg8Tg1lKSvc5q34ysfar4=

cors:
  allowed-origins: http://localhost:4200,http://localhost:80,http://127.0.0.1:4200, http://192.168.1.32:4200
  allowed-origin-patterns: http://192.168.*.*:*

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

---
# Docker Profile (runs in Docker Compose containers)
spring:
  config:
    activate:
      on-profile: docker

  codec:
    max-in-memory-size: 100MB

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth-service/**
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/user-service/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: ressource-service
          uri: ${RESOURCE_SERVICE_URL}
          predicates:
            - Path=/ressource-service/**
          filters:
            - RewritePath=/ressource-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL}
          predicates:
            - Path=/notification-service/**
          filters:
            - RewritePath=/notification-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

        - id: ai-search-service
          uri: ${AI_SEARCH_SERVICE_URL}
          predicates:
            - Path=/ai-service/**
          filters:
            - RewritePath=/ai-service/(?<segment>.*), /$\{segment}
            - name: JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://frontend:80}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:DEBUG}
    reactor.netty: ${LOG_LEVEL_NETTY:DEBUG}
