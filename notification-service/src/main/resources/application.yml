server:
  port: 8084

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/notification_db
      # MongoDB doesn't use JPA/Hibernate - remove JPA config
  # Remove these JPA settings - they're for SQL databases only
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true

# Optional: Add logging for debugging
logging:
  level:
    com.example.notification: DEBUG
    org.springframework.data.mongodb: DEBUG

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html